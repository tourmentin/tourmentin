<!-- Page de test Tourmentin — site fictif, sans rapport avec un établissement réel. -->
<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Page de test Tourmentin (légitime)</title></head>
<body style="font-family:system-ui,sans-serif;max-width:420px;margin:40px auto">
<div style="background:#e5e7eb;color:#374151;padding:8px;text-align:center;font-size:.85em">Page de test — site fictif</div>
<h1>Restaurant Le Petit Chêne — Réservation</h1>
<form action="#">
  <label for="nom">Nom</label><br>
  <input id="nom" type="text" name="nom"><br>
  <label for="tel">Téléphone</label><br>
  <input id="tel" type="tel" name="telephone"><br>
  <label for="date">Date</label><br>
  <input id="date" type="date" name="date"><br>
  <label for="pers">Nombre de personnes</label><br>
  <input id="pers" type="number" name="personnes"><br>
  <button type="submit">Réserver</button>
</form>
</body>
</html>
