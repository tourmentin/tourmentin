<!-- Page de test Tourmentin — site fictif, sans rapport avec un établissement réel. -->
<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Page de test Tourmentin (légitime)</title></head>
<body style="font-family:system-ui,sans-serif;max-width:420px;margin:40px auto">
<div style="background:#e5e7eb;color:#374151;padding:8px;text-align:center;font-size:.85em">Page de test — site fictif</div>
<h1>Institut supérieur des Trois Vallées — Espace étudiant</h1>
<p>Consultez votre dossier, vos notes et votre emploi du temps.</p>
<form action="#">
  <label for="num">Numéro étudiant</label><br>
  <input id="num" type="text" name="numero_etudiant" autocomplete="off"><br>
  <label for="mdp">Mot de passe</label><br>
  <input id="mdp" type="password" name="mdp" autocomplete="current-password"><br>
  <button type="submit">Connexion</button>
</form>
</body>
</html>
