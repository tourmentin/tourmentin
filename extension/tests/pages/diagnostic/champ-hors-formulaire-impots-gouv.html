<!-- ARTEFACT DE TEST TOURMENTIN — imite le vocabulaire d'un service Impôts / DGFiP
     à seule fin de test du détecteur. Aucun logo, aucune image, aucune police
     de marque. Ne représente aucun site réel, n'envoie rien nulle part.

     Spec 12.3.3.5, point 1 : mêmes marqueurs que imitations/01-impots-gouv.html,
     mais le champ mot de passe n'est PAS dans une balise <form> — un
     input[type=password] visible hors formulaire, comme le produit un site
     construit avec un framework JS (React, Vue...) sans balise <form>, ou une
     trousse de hameçonnage qui l'évite délibérément. Selon le chapitre 5 (Z5,
     E1), ni l'une ni l'autre ne mentionne <form> : ce champ doit compter. -->
<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Page de test Tourmentin</title></head>
<body style="font-family:system-ui,sans-serif;max-width:420px;margin:40px auto">
<div style="background:#b91c1c;color:#fff;padding:10px;text-align:center;font-weight:600">
  ⚠ ARTEFACT DE TEST TOURMENTIN — imitation fictive, aucun rapport avec un site réel
</div>
<h1>Votre Espace Particulier</h1>
<p>DGFiP — avis d'imposition, taxe d'habitation, prélèvement à la source.</p>
<div>
  <label for="nf">Numéro fiscal</label><br>
  <input id="nf" type="text" name="numero_fiscal" autocomplete="off"><br>
  <label for="mdp">Mot de passe</label><br>
  <input id="mdp" type="password" name="mdp" autocomplete="current-password"><br>
  <button type="button" onclick="void 0">Se connecter</button>
</div>
</body>
</html>
