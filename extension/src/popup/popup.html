<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Tourmentin</title>
    <style>
      body { font: 14px system-ui, sans-serif; width: 320px; margin: 0; padding: 12px; color: #1a1a1a; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      .statut { margin: 0; padding: 10px 12px; border-radius: 6px; font-weight: 600; line-height: 1.35; color: #fff; }
      .statut-gris { background: #6b7280; }
      .statut-rouge { background: #C0392B; }
      .statut-vert { background: #2E7D32; }
      .statut-vert-pale { background: #C8E6C9; color: #1a1a1a; border: 1px solid #81C784; }
      .statut-orange { background: #D9822B; }
      .statut-bleu { background: #2563EB; }
      .statut-jaune { background: #FACC15; color: #1a1a1a; }
      button.lien { width: auto; margin: 8px 0 0; padding: 0; border: none; background: none; color: #1a4fa0; text-decoration: underline; }
      #details { margin: 6px 0 0; font-size: 12px; }
      #details dt { font-weight: 600; margin-top: 4px; }
      #details dd { margin: 0; white-space: pre-line; }
      button { width: 100%; margin-top: 10px; padding: 8px; cursor: pointer; }
      #confirmation pre { white-space: pre-wrap; word-break: break-word; max-height: 11em; overflow: auto; background: #f4f4f4; padding: 6px; margin: 6px 0; font: 11px/1.4 monospace; }
      #confirmation { display: none; margin-top: 10px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; white-space: pre-line; }
      #confirmation button { margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>Tourmentin</h1>
    <div id="contenu">Analyse en cours…</div>
    <button id="bouton-officiel" style="display: none">Signaler comme site officiel</button>
    <button id="bouton-frauduleuse" style="display: none">Cette page est frauduleuse</button>
    <div id="zone-role" style="display: none">
      <button id="bouton-valider" style="display: none">Valider comme officiel</button>
      <button id="bouton-confirmer-frauduleux" style="display: none">Confirmer frauduleux</button>
      <button id="bouton-gestion" style="display: none">Voir les sites de la base</button>
    </div>
    <div id="confirmation"></div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
